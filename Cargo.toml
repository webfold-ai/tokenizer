[package]
name = "tokenizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "A tokenizer that is a fold: an n-gram counter over a hash table, with no tokenizer.json, no regex and no unsafe."
repository = "https://github.com/webfold-ai/tokenizer"
documentation = "https://docs.rs/tokenizer"
readme = "README.md"
keywords = ["tokenizer", "nlp", "n-gram", "fold", "text"]
categories = ["text-processing"]
exclude = ["/.github", "/deny.toml"]

[dependencies]
# The artifact reader lifts `tokenizer.json` and GGUF metadata through wirefold's parser instead of
# hand-scanning JSON - a published source at a pinned rev (caretaker `DEP-1`).
wirefold = { git = "https://github.com/webfold-ai/wirefold", rev = "28d875794d4541eb952d23984be411348dc3f1c0", features = ["syntax", "derive"] }
apeiron = { git = "https://github.com/webfold-ai/apeiron", rev = "09aa02b05825899556988cc29a3ce291b38798d6" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace]
